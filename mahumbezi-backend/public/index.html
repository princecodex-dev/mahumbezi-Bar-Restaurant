function App() {
  const [token, setToken] = useState(() => { try { return activeStorage ? activeStorage.getItem(TOKEN_KEY) : null; } catch (e) { return null; } });
  const [currentUser, setCurrentUser] = useState(() => {
    try { const raw = activeStorage ? activeStorage.getItem(USER_KEY) : null; return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  });
  const [page, setPage] = useState("Dashboard");
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");

  // PWA Install states
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstallBtn, setShowInstallBtn] = useState(false);
  const [showIOSModal, setShowIOSModal] = useState(false);
  const [isInstalled, setIsInstalled] = useState(false);

  const [orders, setOrders] = useState([]);
  const [menuItems, setMenuItems] = useState([]);
  const [tables, setTables] = useState([]);
  const [inventory, setInventory] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [summary, setSummary] = useState(null);
  const [settings, setSettings] = useState({
    restaurantName: "Mahumbezi Bar & Restaurant",
    address: "",
    phone: "",
    currency: "RWF",
  });
  const [vatRate, setVatRate] = useState(18);

  // Keep the module-level auth token (used by every api.* call) in sync with React state
  useEffect(() => { authToken = token; }, [token]);

  const loadAll = React.useCallback(() => {
    if (!token) return Promise.resolve();
    return Promise.all([
      api.getMenuItems(), api.getTables(), api.getOrders(), api.getInventory(),
      api.getCustomers(), api.getSuppliers(), api.getEmployees(), api.getSettings(),
      api.getReportsSummary(),
    ]).then(([mi, tb, ord, inv, cus, sup, emp, set, rep]) => {
      setMenuItems(mi.map(mapMenuItem));
      setTables(tb.map(mapTable));
      setOrders(ord.map(mapOrder));
      setInventory(inv.map(mapInventory));
      setCustomers(cus.map(mapCustomer));
      setSuppliers(sup.map(mapSupplier));
      setEmployees(emp.map(mapEmployee));
      const s = mapSettings(set);
      setSettings(s);
      setVatRate(s.vatRate);
      setSummary(rep);
      setLoadError("");
    });
  }, [token]);

  useEffect(() => {
    if (!token) { setLoading(false); return; }
    let cancelled = false;
    setLoading(true);
    loadAll()
      .catch((err) => { if (!cancelled) setLoadError(err.message || "Failed to load data from the server."); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [token, loadAll]);

  function handleLoggedIn(tok, refresh, user, remember) {
    const store = remember ? window.localStorage : window.sessionStorage;
    storeSession(store, { token: tok, refreshToken: refresh, user });
    authToken = tok;
    authRefresh = refresh || null;
    setToken(tok);
    setCurrentUser(user);
  }
  function handleLogout() {
    if (authRefresh) {
      api.logout(authRefresh).catch(() => {}); // best-effort — clear local state regardless
    }
    forceLogout();
    setToken(null);
    setCurrentUser(null);
    setPage("Dashboard");
  }

  // React to auto-refresh (role/user updates) and forced logout (expired refresh token)
  useEffect(() => {
    const onToken = (e) => { if (e.detail && e.detail.user) setCurrentUser(e.detail.user); };
    const onLogout = () => { setToken(null); setCurrentUser(null); setPage("Dashboard"); };
    window.addEventListener("mahumbezi:token", onToken);
    window.addEventListener("mahumbezi:logout", onLogout);
    return () => {
      window.removeEventListener("mahumbezi:token", onToken);
      window.removeEventListener("mahumbezi:logout", onLogout);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // PWA: Service Worker Registration
  useEffect(() => {
    if ('serviceWorker' in navigator) {
      const swUrl = '/service-worker.js';
      navigator.serviceWorker.register(swUrl)
        .then((registration) => {
          console.log('[PWA] Service Worker registered:', registration.scope);
          // Check for updates periodically
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] New version available');
                  // Could show a "refresh for update" toast here
                }
              });
            }
          });
        })
        .catch((err) => {
          console.warn('[PWA] Service Worker registration failed:', err);
        });
    }
  }, []);

  // PWA: Handle beforeinstallprompt (Android/Chrome/Edge)
  useEffect(() => {
    const handleBeforeInstallPrompt = (e) => {
      e.preventDefault();
      setDeferredPrompt(e);
      // Check if already installed
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
      const isIOSStandalone = window.navigator.standalone === true;
      if (!isStandalone && !isIOSStandalone) {
        setShowInstallBtn(true);
      }
    };

    const handleAppInstalled = () => {
      setShowInstallBtn(false);
      setDeferredPrompt(null);
      setIsInstalled(true);
      console.log('[PWA] App installed');
    };

    // Check if already running as PWA
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    const isIOSStandalone = window.navigator.standalone === true;
    if (isStandalone || isIOSStandalone) {
      setIsInstalled(true);
    }

    window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
    window.addEventListener('appinstalled', handleAppInstalled);

    // iOS: Detect if we should show "Add to Home Screen" instruction
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isInStandaloneMode = isStandalone || isIOSStandalone;
    const hasSeenIOSPrompt = localStorage.getItem('pwa-ios-prompt-dismissed');
    
    if (isIOS && !isInStandaloneMode && !hasSeenIOSPrompt) {
      // Show after a short delay so user sees the app first
      const timer = setTimeout(() => setShowIOSModal(true), 3000);
      return () => clearTimeout(timer);
    }

    return () => {
      window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      window.removeEventListener('appinstalled', handleAppInstalled);
    };
  }, []);

  const handleInstallClick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      console.log('[PWA] User accepted install');
      setShowInstallBtn(false);
      setIsInstalled(true);
    } else {
      console.log('[PWA] User dismissed install');
    }
    setDeferredPrompt(null);
  };

  const dismissIOSModal = () => {
    setShowIOSModal(false);
    localStorage.setItem('pwa-ios-prompt-dismissed', 'true');
  };

  if (!token) {
    return <LoginScreen onLoggedIn={handleLoggedIn} />;
  }

  if (loading) {
    return <div className="app-loading">Loading Mahumbezi…</div>;
  }

  const KNOWN_PAGES = ["Dashboard", "Orders / POS", "Food & Menu", "Tables", "Inventory / Stock", "Customers", "Suppliers", "Sales & Payments", "Reports", "Employees / Users", "Settings"];

  return (
    <div className="layout">
      <Sidebar page={page} onNavigate={setPage} />
      <div className="main">
        <Topbar user={currentUser} onLogout={handleLogout} data={{ menuItems, tables, orders, inventory, customers, suppliers, employees }} onNavigate={setPage} />
        <main className="content">
          {loadError && (
            <div className="toast" style={{ background: "var(--red-bg)", color: "var(--red)", maxWidth: "480px", marginBottom: "16px" }}>
              Couldn't reach the server: {loadError}
            </div>
          )}
          {page === "Dashboard" && <Dashboard orders={orders} tables={tables} inventory={inventory} summary={summary} onNavigate={setPage} user={currentUser} />}
          {page === "Orders / POS" && <OrdersPOS orders={orders} menuItems={menuItems} tables={tables} vatRate={vatRate} reload={loadAll} />}
          {page === "Food & Menu" && <FoodMenu menuItems={menuItems} reload={loadAll} />}
          {page === "Tables" && <TablesPage tables={tables} orders={orders} reload={loadAll} />}
          {page === "Inventory / Stock" && <InventoryPage inventory={inventory} reload={loadAll} />}
          {page === "Customers" && <CustomersPage customers={customers} reload={loadAll} />}
          {page === "Suppliers" && <SuppliersPage suppliers={suppliers} reload={loadAll} />}
          {page === "Sales & Payments" && <SalesPayments orders={orders} reload={loadAll} />}
          {page === "Reports" && <ReportsPage orders={orders} inventory={inventory} tables={tables} summary={summary} onNavigate={setPage} />}
          {page === "Employees / Users" && <EmployeesPage employees={employees} reload={loadAll} currentUser={currentUser} />}
          {page === "Settings" && <SettingsPage settings={settings} vatRate={vatRate} reload={loadAll} currentUser={currentUser} />}
          {!KNOWN_PAGES.includes(page) && (
            <div className="panel" style={{ textAlign: "center", padding: "60px 20px", color: "var(--text-dim)" }}>
              <div style={{ fontSize: "28px", marginBottom: "10px" }}>🚧</div>
              <div style={{ fontWeight: 700, marginBottom: "4px" }}>{page}</div>
              <div style={{ fontSize: "12.5px" }}>This page hasn't been built yet — ask to build it next.</div>
            </div>
          )}
        </main>
      </div>
    </div>

    {/* PWA Install Button (Android/Chrome/Edge) */}
    {showInstallBtn && !isInstalled && (
      <button
        className="pwa-install-btn"
        onClick={handleInstallClick}
        aria-label="Install Mahumbezi app"
      >
        <span className="pwa-install-icon">📱</span>
        <span className="pwa-install-text">Install App</span>
      </button>
    )}

    {/* iOS Add to Home Screen Modal */}
    {showIOSModal && (
      <div className="pwa-ios-modal" onClick={dismissIOSModal}>
        <div className="pwa-ios-modal-content" onClick={(e) => e.stopPropagation()}>
          <div className="pwa-ios-modal-header">
            <div className="pwa-ios-modal-icon">📱</div>
            <div>
              <div className="pwa-ios-modal-title">Install Mahumbezi</div>
              <div className="pwa-ios-modal-subtitle">Add to Home Screen for quick access</div>
            </div>
          </div>
          <div className="pwa-ios-steps">
            <div className="pwa-ios-step">
              <span className="pwa-ios-step-number">1</span>
              <span className="pwa-ios-step-text">Tap the <strong>Share</strong> button <span style={{fontSize:'16px'}}>⬆️</span> at the bottom of Safari</span>
            </div>
            <div className="pwa-ios-step">
              <span className="pwa-ios-step-number">2</span>
              <span className="pwa-ios-step-text">Scroll down and tap <strong>"Add to Home Screen"</strong></span>
            </div>
            <div className="pwa-ios-step">
              <span className="pwa-ios-step-number">3</span>
              <span className="pwa-ios-step-text">Tap <strong>"Add"</strong> in the top right corner</span>
            </div>
          </div>
          <button className="pwa-ios-close" onClick={dismissIOSModal}>
            Got it, thanks!
          </button>
        </div>
      </div>
    )}
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
